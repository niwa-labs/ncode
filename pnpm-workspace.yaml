overrides:
  "react": "18.3.1"
  "react-dom": "18.3.1"
  "@modelcontextprotocol/sdk>@hono/node-server": "2.0.12"
  "minimatch@>=10.2.5>brace-expansion": "5.0.9"
  "ajv>fast-uri": "3.1.6"
  "express-rate-limit>ip-address": "10.4.0"
  "vitest": "4.1.11"
  "@vitest/coverage-v8": "4.1.11"
  "vite": "7.3.6"
  "hono": "4.13.5"
onlyBuiltDependencies:
  - better-sqlite3
  - esbuild
  - node-pty
# pnpm >= 11 resolves build-script permissions exclusively through allowBuilds
# (onlyBuiltDependencies is kept for the pnpm 9 pinned via packageManager).
# The `false` entries preserve the pnpm 9 status quo: those install scripts
# never ran in this workspace.
allowBuilds:
  better-sqlite3: true
  esbuild: true
  node-pty: true
  "@google/genai": false
  canvas: false
  protobufjs: false
  workerd: false
