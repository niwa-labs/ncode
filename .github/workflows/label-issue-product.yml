name: Label issue product

on:
  issues:
    types: [opened, edited]

permissions:
  issues: write

concurrency:
  group: issue-product-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  label-product:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: ${{ !github.event.issue.pull_request }}
    steps:
      - name: Synchronize product labels
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          node <<'EOF'
          const fs = require('node:fs');

          async function main() {
            const event = JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8'));
            const repositoryPath = `/repos/${process.env.GITHUB_REPOSITORY}`;
            const issuePath = `${repositoryPath}/issues/${event.issue.number}`;
            const labelPath = `${repositoryPath}/labels`;
            async function request(path, method = 'GET', body, allowedStatus) {
              const response = await fetch(`${process.env.GITHUB_API_URL}${path}`, {
                method,
                headers: {
                  Authorization: `Bearer ${process.env.GH_TOKEN}`,
                  Accept: 'application/vnd.github+json',
                  'Content-Type': 'application/json',
                },
                body: body === undefined ? undefined : JSON.stringify(body),
              });
              if (!response.ok && response.status !== allowedStatus) {
                throw new Error(`GitHub ${method} failed: ${response.status}`);
              }
              return response;
            }

            async function ensureLabel(label) {
              const path = `${labelPath}/${label.name}`;
              const existing = await request(path, 'GET', undefined, 404);
              if (existing.ok) return;
              const created = await request(labelPath, 'POST', label, 422);
              // Another issue's run may have created the same repository label.
              if (!created.ok) await request(path);
            }

            // Read current state so queued edits cannot restore an outdated label.
            const issue = await (await request(issuePath)).json();
            const body = (issue.body || '').replace(/\r\n/g, '\n');
            const product = body.match(/^### Product or interface\n+([^\n]+)\n*(?=### |$)/m)?.[1].trim();
            const labels = new Set(issue.labels.map(label => label.name));
            const missing = [];
            if (event.action === 'opened' && issue.state === 'open' && !labels.has('needs-triage')) {
              missing.push({ name: 'needs-triage', color: 'ededed', description: 'Awaiting maintainer assessment' });
            }
            if (product === 'CLI - interactive TUI' && !labels.has('tui')) {
              missing.push({ name: 'tui', color: 'bfdadc', description: 'Interactive terminal interface' });
            }
            for (const label of missing) await ensureLabel(label);
            if (missing.length > 0) {
              await request(`${issuePath}/labels`, 'POST', { labels: missing.map(label => label.name) });
            }
            // Leave manual labels alone when no supported form answer exists.
            const nonTui = ['CLI - headless', 'CLI - ACP', 'Source build or repository tooling'];
            if (nonTui.includes(product) && labels.has('tui')) {
              await request(`${issuePath}/labels/tui`, 'DELETE', undefined, 404);
            }
          }

          main();
          EOF
