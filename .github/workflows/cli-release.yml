name: Ncode package verification
on:
  push:
    tags: ['v*.*.*']
  pull_request:
    paths:
      - '.github/workflows/cli-release.yml'
      - 'scripts/build.mjs'
      - 'scripts/*cli-release.mjs'
      - 'scripts/lib/cli-release.mjs'
      - 'scripts/verify.mjs'
      - 'test/smoke.test.mjs'
      - 'test/byok.test.mjs'
      - 'pnpm-lock.yaml'
      - 'package.json'
      - 'packages/tui/package.json'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Optional tag matching the source version for package verification'
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: cli-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      matrix: ${{ steps.release.outputs.matrix }}
      tag: ${{ steps.release.outputs.tag }}
      archive: ${{ steps.release.outputs.archive }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: pnpm
      - name: Validate release version and revision
        id: release
        shell: bash
        run: |
          if [ "$REF_TYPE" = tag ] && { [ "$EVENT_NAME" = push ] || [ "$EVENT_NAME" = workflow_dispatch ]; }; then
            if [ -n "$REQUESTED_TAG" ] && [ "$REQUESTED_TAG" != "$REF_NAME" ]; then
              echo "The verification input must match the release tag." >&2
              exit 1
            fi
            export REQUESTED_TAG="$REF_NAME"
            test "$(git rev-parse "refs/tags/$REF_NAME^{commit}")" = "$(git rev-parse HEAD)"
            git merge-base --is-ancestor HEAD refs/remotes/origin/main
          fi
          node --input-type=module <<'JS'
          import { appendFileSync } from "node:fs";
          import { cliBuildVersion, cliReleaseArchiveName, cliReleaseTargets } from "./scripts/lib/cli-release.mjs";
          const tag = process.env.REQUESTED_TAG || `v${cliBuildVersion(process.cwd())}`;
          const version = cliBuildVersion(process.cwd(), tag);
          const archive = cliReleaseArchiveName(version);
          const matrix = JSON.stringify({ include: cliReleaseTargets });
          appendFileSync(process.env.GITHUB_OUTPUT, `tag=${tag}\narchive=${archive}\nmatrix=${matrix}\n`);
          appendFileSync(process.env.GITHUB_ENV, `MCODE_RELEASE_TAG=${tag}\n`);
          JS
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          REQUESTED_TAG: ${{ inputs.tag || '' }}
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/setup-gitleaks
      - name: Scan source history
        run: gitleaks git --redact --config .gitleaks.toml --log-opts=--all
      - run: pnpm verify
        env:
          MCODE_VERIFY_REPORT_DIR: ${{ runner.temp }}/build-report
      - name: Scan distribution
        run: gitleaks dir dist --redact --config .gitleaks.toml
      - name: Build the Ncode archive
        shell: bash
        run: node scripts/package-cli-release.mjs "$MCODE_RELEASE_TAG" "$RUNNER_TEMP/package"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cli-package
          path: ${{ runner.temp }}/package/
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ always() }}
        with:
          name: cli-build-report
          path: ${{ runner.temp }}/build-report/
          retention-days: 14
  install:
    needs: build
    env:
      MCODE_RELEASE_TAG: ${{ needs.build.outputs.tag }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.build.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: cli-package
          path: ${{ runner.temp }}/package
      - run: pnpm verify --profile package
        env:
          MCODE_RELEASE_ARCHIVE: ${{ runner.temp }}/package/${{ needs.build.outputs.archive }}
          MCODE_VERIFY_REPORT_DIR: ${{ runner.temp }}/install-report
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ always() }}
        with:
          name: cli-install-${{ matrix.os }}-${{ matrix.node }}
          path: ${{ runner.temp }}/install-report/
          retention-days: 14
  publish:
    needs: [build, install]
    # Publish only for a release tag validated by build: a pushed tag, or a
    # dispatch run on one.
    if: github.ref_type == 'tag' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Minimal OIDC grant for npm trusted publishing. The npm trusted publisher
    # for @niwa-labs/ncode must be registered for niwa-labs/ncode and the
    # cli-release.yml workflow file without a GitHub environment.
    permissions:
      id-token: write
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org/'
          package-manager-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: cli-package
          path: ${{ runner.temp }}/package
      - name: Check the tested archive against the release tag
        shell: bash
        env:
          ARCHIVE: ${{ needs.build.outputs.archive }}
        run: |
          cd "$RUNNER_TEMP/package"
          test "$ARCHIVE" = "ncode-${GITHUB_REF_NAME#v}.tar.gz"
          node --input-type=module <<'JS'
          import assert from "node:assert/strict";
          import { createHash } from "node:crypto";
          import { readFileSync } from "node:fs";
          const { ARCHIVE: archive } = process.env;
          const sha256 = createHash("sha256").update(readFileSync(archive)).digest("hex");
          assert.equal(readFileSync(`${archive}.sha256`, "utf8"), `${sha256}  ${archive}\n`, "Release archive checksum mismatch");
          JS
      # No npm token is configured: npm >= 11.5.1 authenticates with the
      # workflow OIDC token and publishes the exact tarball every install
      # job verified.
      - name: Publish to npm with OIDC trusted publishing
        shell: bash
        env:
          ARCHIVE: ${{ needs.build.outputs.archive }}
        run: |
          node --input-type=module <<'JS'
          import { execFileSync } from "node:child_process";
          const version = execFileSync("npm", ["--version"], { encoding: "utf8" }).trim();
          const [major, minor, patch] = version.split(".").map(Number);
          if (major < 11 || (major === 11 && (minor < 5 || (minor === 5 && patch < 1)))) {
            throw new Error(`npm ${version} is too old for OIDC trusted publishing; npm >= 11.5.1 is required.`);
          }
          JS
          case "$GITHUB_REF_NAME" in
            *-*) distTag=next ;;
            *) distTag=latest ;;
          esac
          npm publish --provenance --access public --tag "$distTag" "$RUNNER_TEMP/package/$ARCHIVE"
