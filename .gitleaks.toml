title = "MiniMax Code source and history scanning"
[extend]
useDefault = true

[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
description = "Permission translation key, not a credential"
condition = "AND"
paths = ['''(^|/)packages/agent-modules/permission/src/tools/bash-checker\.ts$''']
regexTarget = "match"
regexes = ['''^labelKey: 'permission\.scope\.byArgvPrefix2'$''']

[[rules.allowlists]]
description = "Documented keyboard shortcut"
condition = "AND"
paths = ['''(^|/)(packages/local-runtime|dist)/assets/skills/cu-desktop/SKILL\.md$''']
regexTarget = "match"
regexes = ['''^desktop_key combo="ctrl\+shift\+Escape"$''']

[[rules.allowlists]]
description = "Pagination example ends with explicit xxxx placeholder"
condition = "AND"
paths = ['''(^|/)(packages/local-runtime|dist)/assets/skills/lark-tools/cli-skills/lark-im/references/lark-im-reactions\.md$''']
regexTarget = "match"
regexes = ['''^page_token": "YhljsPiGfUgnVAg9urvRFd-BvSqRLxxxx"$''']

[[rules.allowlists]]
description = "PDF form field identifier, not an API key"
condition = "AND"
paths = ['''(^|/)(packages/local-runtime|dist)/assets/skills/pdf/templates/form-fill-acroform/cases/italy-schengen-visa-(zhangwei|example)/field_values\.case\.json$''']
regexTarget = "match"
regexes = ['''^key": "p1-place-of-birth"$''']

[[rules.allowlists]]
description = "TUI next-prompt keyboard shortcut"
condition = "AND"
paths = ['''(^|/)packages/tui/src/tui/engine/keybindings\.ts$''']
regexTarget = "match"
regexes = ['''^defaultKeys: "ctrl\+shift\+down"$''']

[[rules.allowlists]]
description = "Bundled TUI shortcut and permission translation key"
condition = "AND"
paths = ['''(^|/)dist/chunks/(chunk|launcher)-[A-Z0-9]+\.js$''']
regexTarget = "match"
regexes = ['''^defaultKeys: ?"ctrl\+shift\+down"$''', '''^labelKey: ?"permission\.scope\.byArgvPrefix2"$''']

[[rules.allowlists]]
description = "Bundled node-forge public PKCS12 algorithm names"
condition = "AND"
paths = ['''(^|/)dist/chunks/chunk-[A-Z0-9]+\.js$''']
regexTarget = "match"
regexes = ['''^pbeWithSHAAnd3-KeyTripleDES-CBC","pbewithSHAAnd40BitRC2-CBC"$''']

[[rules.allowlists]]
description = "Bundled IM binding migration guard, no credential value"
condition = "AND"
paths = ['''(^|/)dist/chunks/chunk-[A-Z0-9]+\.js$''']
regexTarget = "match"
regexes = ['''^[A-Za-z_$][A-Za-z0-9_$]*\.resolvedProjectKey\|\|[A-Za-z_$][A-Za-z0-9_$]*\.mutationReceipts===void $''']

[[rules.allowlists]]
description = "node-forge PKCS12 function alias, no key material"
condition = "AND"
paths = ['''(^|/)dist/chunks/chunk-[A-Z0-9]+\.js$''']
regexTarget = "match"
regexes = ['''^[A-Za-z_$][A-Za-z0-9_$]*\.generateKey = [A-Za-z_$][A-Za-z0-9_$]*\.pbe\.generatePkcs12Key;?$''']

[[rules.allowlists]]
description = "Exact synthetic privacy regression marker, including historical commits"
condition = "AND"
paths = ['''(^|/)packages/local-runtime/test/unit/error-reporting-privacy\.test\.ts$''']
regexTarget = "match"
regexes = ['''^SECRET = 'SYNTHETIC_PRIVATE_4cd7'$''']

[[rules.allowlists]]
description = "RFC WebSocket handshake fixture from Pi v1.5.2"
condition = "AND"
paths = ['''(^|/)third_party/chord/test/node/http/upgrades\.test\.ts$''']
regexTarget = "match"
regexes = [
  '''^nSec\-WebSocket\-Key:\ dGhlIHNhbXBsZSBub25jZQ==\\r$''',
]

[[rules.allowlists]]
description = "Record keys from the Chord schema archive fixture at Pi v1.5.2"
condition = "AND"
paths = ['''(^|/)third_party/chord/test/schema/stored/archive\.jsonl$''']
regexTarget = "match"
regexes = [
  '''^key":"01a1943d\-176c\-71f3\-a32c\-b9cbc67247a3"$''',
  '''^key":"01a1943d\-176e\-71f3\-a32c\-b9cc7f5426c6"$''',
  '''^key":"01a1943d\-176f\-71f3\-a32c\-b9cf6bb98dc7"$''',
]

[[rules.allowlists]]
description = "Base64 JSON parser fixtures from Pi v1.5.2"
condition = "AND"
paths = ['''(^|/)third_party/pi\-mono/packages/ai/test/data/json\-test\-suite\.json$''']
regexTarget = "match"
regexes = [
  '''^y_object_duplicated_key\.json":\ "eyJhIjoiYiIsImEiOiJjIn0="$''',
  '''^y_object_duplicated_key_and_value\.json":\ "eyJhIjoiYiIsImEiOiJiIn0="$''',
  '''^y_object_escaped_null_in_key\.json":\ "eyJmb29cdTAwMDBiYXIiOiA0Mn0="$''',
]

[[rules.allowlists]]
description = "Verified SHA-256 digests of generated provider catalogs, including bundled copies"
condition = "AND"
paths = [
  '''(^|/)third_party/pi\-mono/packages/ai/src/providers/data/\.manifest\.json$''',
  '''(^|/)dist/chunks/chunk-[A-Z0-9]+\.js$''',
]
regexTarget = "match"
regexes = [
  '''^qwen\-token\-plan\-cn\.json":"80824536f0c3cd83ab27424df2d664738cbe3f971b4e568a625432288fa53229"$''',
  '''^qwen\-token\-plan\-cn\.json":"e0baa915644eea7b2c59c525a1660465e55bea51577ff9cc2e0863ad46b70328"$''',
  '''^qwen\-token\-plan\.json":"0630bf7fea9d8579c7ac990e32c40c3685f9db20b6dbfaf745b361fe5203113c"$''',
  '''^qwen\-token\-plan\.json":"600e61f7dfad9833ea1c2c31018d2bd544297ad3158b96953c8a70f9ed6ec693"$''',
  '''^xiaomi\-token\-plan\-ams\.json":"34fe47b0a79fec7843a01d542cb64b736e651a3e6691cc851183e5ce3eae0118"$''',
  '''^xiaomi\-token\-plan\-cn\.json":"e69f9704b450dbb34b6db61a7b224dab5e5a91a39af3e505ecca4db8bfdc04f0"$''',
  '''^xiaomi\-token\-plan\-sgp\.json":"fd28cc293208617127ff888873772b7b52160538caa07ca3af641f3208d3ad20"$''',
]
